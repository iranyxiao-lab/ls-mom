# pnpm 10+ 默认禁止依赖包执行安装脚本；这里只放行构建必需的原生依赖
allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  # 仅打印赞助信息的安装脚本，不放行
  core-js-pure: false
# form-create 设计器依赖固定到发布满 14 天的版本（设计器只作编辑器，存储只保存 LS FormSchema）
overrides:
  "@form-create/core": 3.3.4
  "@form-create/utils": 3.3.0
  "@form-create/component-subform": 3.3.0
  "@form-create/component-elm-tree": 3.3.0
  "@form-create/component-elm-frame": 3.3.0
  "@form-create/component-elm-group": 3.3.0
  "@form-create/component-elm-radio": 3.3.0
  "@form-create/component-elm-select": 3.3.0
  "@form-create/component-elm-upload": 3.3.0
  "@form-create/component-elm-checkbox": 3.3.0
  "@form-create/component-wangeditor": 3.3.0
  "@babel/runtime": 7.29.10
  "@babel/runtime-corejs3": 7.29.10
  "ansi-regex@6": 6.4.0
