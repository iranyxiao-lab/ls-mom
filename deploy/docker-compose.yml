# LS-MOM 单客户部署：app + PostgreSQL 16（含 pgvector）+ Redis + SeaweedFS（S3）+ 前端 nginx
# 用法：cd deploy && cp .env.example .env && docker compose up -d
# 可选：docker compose --profile dcs up -d   额外启动独立时序库（DCS 降采样数据不进业务库）

x-env-defaults: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-lsmom}
  DB_USER: ${DB_USER:-lsmom}
  DB_PASSWORD: ${DB_PASSWORD:-lsmom-local-only}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lsmom}
      POSTGRES_USER: ${DB_USER:-lsmom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lsmom-local-only}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${LSMOM_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-lsmom-local-only}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lsmom-local-only}

  # 对象存储：SeaweedFS（S3 兼容，Apache-2.0）。业务只通过 S3 接口访问，可替换为其他 S3 实现
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lsmom}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lsmom-local-only}
    # 启动时由环境变量生成 S3 访问身份配置
    entrypoint: ["sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"lsmom","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024
        -volume.max=0 -filer -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -qO- http://127.0.0.1:8888/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 一次性任务：创建业务附件桶（已存在则跳过）
  s3-init:
    image: chrislusf/seaweedfs:4.53
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-lsmom}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 | grep -qw "$$S3_BUCKET" ||
        echo "s3.bucket.create -name $$S3_BUCKET" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: deploy/docker/app.Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    image: lsmom/app:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lsmom-local-only}
      # 管理端点（/actuator）Basic 认证账号，供容器健康检查与监控使用
      MONITOR_USERNAME: ${MONITOR_USERNAME:-lsmom-monitor}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:-lsmom-local-only}
      # 演示种子（组织、角色、演示账号、字典、对象存储配置）；生产部署设为 false
      LSMOM_SEED_DEMO_ENABLED: ${LSMOM_SEED_DEMO_ENABLED:-true}
      # 登录验证码；仅自动化验收环境可关闭
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
      # 表结构漂移：FAIL 拒绝启动；排障恢复时可临时设为 WARN（见 docs/crud.md「表结构指纹」）
      LSMOM_SCHEMA_DRIFT_MODE: ${LSMOM_SCHEMA_DRIFT_MODE:-FAIL}
      LSMOM_PACK_DIRECT_INSTALL: ${LSMOM_PACK_DIRECT_INSTALL:-false}
      # DCS 只读集成（--profile dcs 时设 LSMOM_DCS_ENABLED=true）：以只读账号读取 Historian
      LSMOM_DCS_ENABLED: ${LSMOM_DCS_ENABLED:-false}
      LSMOM_DCS_HISTORIAN_URL: jdbc:postgresql://tsdb:5432/lsmom_ts
      LSMOM_DCS_HISTORIAN_USER: lsmom_reader
      LSMOM_DCS_HISTORIAN_PASSWORD: ${HISTORIAN_READER_PASSWORD:-lsmom-local-only}
      LSMOM_SEED_DEMO_S3_ENDPOINT: seaweedfs:8333
      LSMOM_SEED_DEMO_S3_ACCESSKEY: ${S3_ACCESS_KEY:-lsmom}
      LSMOM_SEED_DEMO_S3_SECRETKEY: ${S3_SECRET_KEY:-lsmom-local-only}
      LSMOM_SEED_DEMO_S3_BUCKET: ${S3_BUCKET:-lsmom}
    volumes:
      - applogs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$${MONITOR_USERNAME}:$${MONITOR_PASSWORD}\" http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: lsmom/web:local
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${LSMOM_HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 可选：DCS 降采样与报警的独立时序库（--profile dcs）
  tsdb:
    profiles: ["dcs"]
    image: timescale/timescaledb:2.19.3-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lsmom_ts
      POSTGRES_USER: ${DB_USER:-lsmom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lsmom-local-only}
      HISTORIAN_READER_PASSWORD: ${HISTORIAN_READER_PASSWORD:-lsmom-local-only}
    volumes:
      - tsdata:/var/lib/postgresql/data
      - ./tsdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d lsmom_ts"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 可选：DCS 模拟器（--profile dcs），模拟现场 Historian 的数据来源
  dcs-simulator:
    profiles: ["dcs"]
    build:
      context: ..
      dockerfile: deploy/docker/dcs-simulator.Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    image: lsmom/dcs-simulator:local
    restart: unless-stopped
    depends_on:
      tsdb:
        condition: service_healthy
    environment:
      HISTORIAN_URL: jdbc:postgresql://tsdb:5432/lsmom_ts
      HISTORIAN_USER: ${DB_USER:-lsmom}
      HISTORIAN_PASSWORD: ${DB_PASSWORD:-lsmom-local-only}
    command: ["--mode", "live", "--backfill-hours", "${DCS_BACKFILL_HOURS:-6}"]

volumes:
  pgdata:
  redisdata:
  s3data:
  applogs:
  tsdata:
