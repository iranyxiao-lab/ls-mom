# 后端长连接池：不复用连接时，高并发下 nginx 到 app 的本地端口会耗尽（connect() failed (99)）
upstream lsmom_app {
    server app:8080;
    keepalive 128;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # 压缩：构建产物已预压缩（.gz）直接发送，其余文本响应（含接口 JSON）即时压缩
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    # 管理端点不对外暴露
    location ~ ^(/[^/]*)?/actuator.*(/.*)?$ {
        return 403;
    }

    # 带内容哈希的静态资源长期缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        # 入口页不缓存，发版后立即拿到新的资源清单
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    location /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        # SSE 推送
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_pass http://lsmom_app/;
    }
}
