name: backend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: 构建、单测、ArchUnit、Testcontainers
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # spec dcs/dcs-integration「只读边界」：Operation、MCP 工具与 DCS 接口中不得出现 DCS 写入类能力
      - name: DCS 写入能力黑名单扫描
        run: |
          python3 -m pip install --quiet pyyaml==6.0.2
          python3 scripts/ci/scan-dcs-write.py
      # Agent 永不暴露清单：命中清单的 Operation 只能是 DENY / NONE；docs/agent-boundary.md 与 agent-denylist.txt 一致
      - name: Agent 暴露等级扫描
        run: |
          python3 scripts/ci/scan-agent-exposure.py --self-test
          python3 scripts/ci/scan-agent-exposure.py
      # DOM-05：核心 schema 与核心代码中不得出现培训 / 咨询等扩展领域概念（只能由扩展 Pack 提供）
      - name: DOM-05 核心领域纯净扫描
        run: |
          python3 scripts/ci/scan-dom05.py --self-test
          python3 scripts/ci/scan-dom05.py
      # 上游模块默认跳过测试；ls-mom-modules 覆盖为执行测试（含架构测试与基于 Docker 的 PostgreSQL 集成测试）
      - name: Maven 构建与测试
        run: mvn -B -ntp install
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
