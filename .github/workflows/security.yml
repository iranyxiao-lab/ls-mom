name: security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: 密钥扫描（gitleaks）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 上游演示密钥按指纹豁免，见 .gitleaksignore；新增任何密钥都会失败
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --no-banner --redact --exit-code 1 \
            --gitleaks-ignore-path /repo/.gitleaksignore

  licenses-sbom:
    name: 许可证扫描与 CycloneDX SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: plus-ui/pnpm-lock.yaml
      # 只统计随应用分发的运行期依赖（ruoyi-admin 可执行包）
      - name: 后端 SBOM
        run: >
          mvn -B -ntp -pl ruoyi-admin -am -DskipTests install
          org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom
          -DincludeTestScope=false -DincludeProvidedScope=false -DincludeSystemScope=false
          -DoutputFormat=json -DoutputName=bom
      - name: 前端 SBOM
        working-directory: plus-ui
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm sbom --sbom-format cyclonedx --prod --out ../sbom-frontend.json
      - name: 许可证门禁（拒绝 GPL／AGPL）
        run: python3 scripts/ci/check-licenses.py ruoyi-admin/target/bom.json sbom-frontend.json
      - name: 上传 SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            ruoyi-admin/target/bom.json
            sbom-frontend.json
          retention-days: 90
