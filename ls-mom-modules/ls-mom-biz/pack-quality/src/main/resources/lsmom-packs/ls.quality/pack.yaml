# 质量标准 Pack：质量记录（可独立、可多对象关联）、不符合项（条件必填）、受控质量闭环（登记 → 车间审核 → 整改工作 → 验证 → 关闭）
code: ls.quality
version: 1.0.2
name: 质量
description: 质量记录、不符合项、受控质量流程、整改证据要求、质量终判仅限真人
standard: true
owner: { name: LS 标准产品组 }
requester: { name: 质量记录与不符合项（切片 C） }
reviewDue: 2027-12-31
dependsOn:
  - { code: ls.asset, version: ">=1.0.0" }
contents:
  concepts:
    - ls.quality.QualityRecord
    - ls.quality.NonConformance
  operations:
    - ls.quality.QualityRecord.submit
    - ls.quality.NonConformance.submit
    - ls.quality.NonConformance.audit
    - ls.quality.NonConformance.reject
    - ls.quality.NonConformance.submitVerify
    - ls.quality.NonConformance.close
    - ls.quality.NonConformance.verifyFail
  rules:
    - ls.quality.ncHighAsset
    - ls.quality.ncHighAction
    - ls.quality.humanFinalJudgement
  views:
    - ls.quality.recordForm
    - ls.quality.ncForm
entries:
  - { name: 质量记录, path: /quality/records, group: ledger }
  - { name: 不符合项, path: /quality/nc }
