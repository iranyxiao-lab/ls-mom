code: ls.production.MaterialRecord
displayName: 物料记录
description: 领用、投料、退料、转移的事实记录；默认不核销库存、不校验物料平衡
fields:
  - { code: kind, displayName: 类型, dataType: ENUM, required: true, options: [ISSUE, FEED, RETURN, TRANSFER], props: { queryable: true } }
  - { code: material, displayName: 物料, dataType: STRING, required: true, props: { queryable: true, label: true, maxLength: 100 } }
  - { code: quantity, displayName: 数量, dataType: DECIMAL, required: true }
  - { code: unit, displayName: 单位, dataType: STRING, required: true, props: { maxLength: 32 } }
  - { code: workItem, displayName: 工作, dataType: REF, refConcept: ls.core.Work, props: { queryable: true } }
  - { code: recordedAt, displayName: 记录时间, dataType: DATETIME, props: { queryable: true, sortable: true } }
  - { code: fromLocation, displayName: 来源位置, dataType: STRING, props: { maxLength: 100 } }
  - { code: toLocation, displayName: 去向位置, dataType: STRING, props: { maxLength: 100 } }
  - { code: note, displayName: 说明, dataType: TEXT }
