# UI 走查启发式清单（acceptance-walkthrough 6.3，spec quality/ui-walkthrough）。
# tools/manual.ts 按 页面 × 视口 × 主题 为每一节逐项生成检查表；结果填 通过 / 问题 / 不适用，问题必须写说明并附截图。
# 定级参考 acceptance/README.md「缺陷定级」：影响完成任务的记 S2，有替代路径的体验问题记 S3，文案与细节记 S4。
groups:
  - name: 可用性启发式
    items:
      - id: H-01
        name: 系统状态可见
        judge: 每个操作 1 秒内有可见反馈（按钮加载态、进度、成功提示）；长任务显示进度并可离开页面
        example: 点「提交」后按钮变为加载中，完成后出现「已提交」提示；导入 5000 行时顶栏任务图标显示进度
      - id: H-02
        name: 贴近现场语言
        judge: 页面文字使用车间日常用语，不出现内部编码、英文枚举值或技术术语
        example: 显示「待车间审核」而不是「PENDING_AUDIT」；显示「设备」而不是「ls.asset.Asset」
      - id: H-03
        name: 用户可控与可撤销
        judge: 可撤销的操作提供撤销入口；对话框、抽屉都能用关闭按钮或 Esc 退出；误操作不会直接造成不可恢复的结果
        example: 拖动工作到中班后 5 秒内可点「撤销」；关闭未保存的表单时提示「继续编辑 / 仍然关闭」
      - id: H-04
        name: 一致性与标准
        judge: 同类动作的位置、名称、颜色在各页面一致；主按钮只有一个且在固定位置
        example: 所有列表「新增」都在工具栏左侧；所有确认框主按钮在右侧
      - id: H-05
        name: 防错
        judge: 不可逆或高影响操作前有说明后果的确认；必填、格式、条件必填在提交前就近提示
        example: 「关闭 Issue」确认框列出将关闭的问题与整改工作数量；高严重度不符合项未填立即措施时字段下直接提示
      - id: H-06
        name: 识别而非回忆
        judge: 选项、默认值、上次填写内容直接可见；不要求记住编码或在页面间抄写
        example: 从设备报缺陷时设备、位置已带出；引用字段可按名称搜索并显示名称
      - id: H-07
        name: 灵活高效
        judge: 高频操作有快捷方式（命令面板、键盘、批量、扫码），熟练用户不被向导拖慢
        example: Ctrl+K 输入工作单编号直达；子表 Enter 跳下一格、末行自动新增
      - id: H-08
        name: 简洁的界面
        judge: 首屏只呈现完成当前任务需要的信息；次要信息折叠；没有无用的装饰或重复信息
        example: 移动报工页只显示数量、单位、照片与提交；技术详情默认折叠
      - id: H-09
        name: 帮助用户识别、诊断并恢复错误
        judge: 错误提示说明原因与解决办法，提供修复入口，附追踪编号；不展示堆栈
        example: 分派被拒时提示「李四的动火作业资质已于 10 月 3 日过期」，并提供「改派他人」「查看培训记录」
      - id: H-10
        name: 帮助与引导
        judge: 首次使用有可跳过的引导；复杂字段有就近说明；可从帮助菜单重新查看
        example: 首次进入工作台自动引导，跳过后不再出现；字段旁的说明图标悬浮显示说明
  - name: 设计系统一致性
    items:
      - id: D-01
        name: 颜色与令牌
        judge: 颜色、圆角、阴影来自设计令牌；深色主题下没有白底、黑字或看不清的区域
        example: 切换深色后卡片、表格、抽屉背景同步变暗，状态标签仍可辨认
      - id: D-02
        name: 字号与间距
        judge: 同层级标题字号一致；表单项、卡片、列表的间距符合密度档位；无挤压或错位
        example: 紧凑密度下列表行高变小，表单仍为舒适间距
      - id: D-03
        name: 状态与反馈组件
        judge: 加载用骨架屏，空态有说明与主操作，错误态有原因、重试与追踪编号；状态同时有颜色、图标和文字
        example: 我的待办为空时显示「暂无待办」与「查看我发起的」按钮
      - id: D-04
        name: 响应式与无横向滚动
        judge: 手机、平板、桌面三档视口下没有整页横向滚动；内容未被裁切；平板上列表次要列收到行展开区
        example: 平板竖屏打开台账列表，只显示前三列与状态、操作，其余在行展开区
      - id: D-05
        name: 图标与文案
        judge: 图标含义清楚且带可读标签；按钮文案是动词；标点、空格中英文规范
        example: 图标按钮悬停显示「刷新」；按钮写「提交审核」而不是「确定」
  - name: 关键交互专项
    items:
      - id: K-01
        name: 操作预算
        judge: 移动报工 ≤5 次点击、首页待办审核 ≤3 次点击、从设备报缺陷 ≤4 次点击（文字输入不计）
        example: 首页点待办→填意见→通过，共 2～3 次点击
      - id: K-02
        name: 表单校验与错误定位
        judge: 前端就近校验与服务端规则一致；服务端拒绝时定位到具体字段或子表单元格并滚动聚焦
        example: 子表第 3 行缺工器具时该单元格高亮，错误汇总可点击定位
      - id: K-03
        name: 草稿与恢复
        judge: 填写中途关闭或会话过期不丢内容；再次打开提示恢复或丢弃
        example: 关闭浏览器后重新打开登记页，提示「发现未提交的草稿（10:32）」
      - id: K-04
        name: 列表效率
        judge: 筛选即时生效且条件可单独移除；视图可保存；批量操作逐条反馈并可只重试失败项
        example: 点「我负责的」「今天到期」后顶部出现两个可移除的条件标签
      - id: K-05
        name: 流程引导
        judge: 单据顶部说明当前状态与下一步（等待谁、剩余时间、轮到我时的唯一主按钮）；退回原因醒目
        example: 发起人看到「等待 张三（车间主任）审核，剩余 20 小时」与「催办」
  - name: 键盘与读屏抽查
    items:
      - id: A-01
        name: 键盘可达
        judge: 只用 Tab / Shift+Tab / Enter / Esc / 方向键能完成本页主要任务；焦点顺序与视觉顺序一致
        example: 在审批抽屉中 Tab 到意见框填写，Tab 到「通过」按 Enter，Esc 关闭抽屉
      - id: A-02
        name: 焦点可见与回归
        judge: 每个可聚焦元素有清晰的焦点环；关闭弹窗或抽屉后焦点回到触发它的元素
        example: 关闭「高级筛选」抽屉后焦点回到「高级筛选」按钮
      - id: A-03
        name: 读屏可理解
        judge: 用读屏（如 NVDA、VoiceOver）朗读时，按钮、图标、表单项都有名称，错误与提示会被播报
        example: 图标按钮读作「刷新 按钮」；提交失败时播报错误汇总
      - id: A-04
        name: 对比度与缩放
        judge: 正文对比度 ≥4.5:1；浏览器缩放到 200% 时内容不丢失、不重叠
        example: 深色主题下次要文字仍清晰可读；200% 缩放时侧栏收起、表格可横向滚动而页面不横向滚动
