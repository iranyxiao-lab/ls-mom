    mode: AUTO
    script: plus-ui/tests/unit/schema-form.spec.ts#移动端只显示精简字段，提交仍按完整表单校验
  - id: AC-FORM-FS-005
    title: 看板写 SQL
    ref: { change: bootstrap-ls-mom-mvp, spec: form/form-schema, requirement: 多形态视图, scenario: 看板写 SQL }
    codes: [ FORM-04 ]
    slice: PLATFORM
    roles: [ 实施顾问, 班组长 ]
    dataset: acceptance
    steps:
      - 看板绑定中出现原始 SQL
    expected:
