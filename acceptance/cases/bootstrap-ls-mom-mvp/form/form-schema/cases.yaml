cases:
  - id: AC-FORM-FS-001
    title: 字段未绑定 Concept
    ref: { change: bootstrap-ls-mom-mvp, spec: form/form-schema, requirement: FormSchema 结构, scenario: 字段未绑定 Concept }
    codes: [ FORM-01 ]
    slice: PLATFORM
    roles: [ 实施顾问, 班组长 ]
    dataset: acceptance
    steps:
      - 发布的表单字段 `key` 不存在于目标 Concept
    expected:
      - 发布校验失败
    mode: AUTO
    script: ls-mom-modules/ls-mom-form/src/test/java/com/lsmom/form/ViewSchemaTest.java#字段未绑定Concept时被拒
  - id: AC-FORM-FS-002
    title: 引用越过滤
    ref: { change: bootstrap-ls-mom-mvp, spec: form/form-schema, requirement: 服务端按 Schema 校验, scenario: 引用越过滤 }
    codes: [ FORM-02 ]
    slice: PLATFORM
    roles: [ 实施顾问, 班组长 ]
    dataset: acceptance
    steps:
      - 提交的设备引用不属于 `$context.orgId` 过滤范围
    expected:
      - 后端拒绝并指出字段 `asset`
    mode: AUTO
    script: ls-mom-modules/ls-mom-form/src/test/java/com/lsmom/form/FormRecordTest.java#引用越过orgId过滤被拒并指出字段
  - id: AC-FORM-FS-003
    title: 绑定草稿 Operation
    ref: { change: bootstrap-ls-mom-mvp, spec: form/form-schema, requirement: 动作只绑定已发布 Operation, scenario: 绑定草稿 Operation }
    codes: [ FORM-03 ]
    slice: PLATFORM
    roles: [ 实施顾问, 班组长 ]
    dataset: acceptance
    steps:
      - 表单提交按钮绑定一个尚未发布的 Operation
    expected:
      - 表单发布失败
    mode: AUTO
    script: ls-mom-modules/ls-mom-form/src/test/java/com/lsmom/form/FormRecordTest.java#动作绑定草稿Operation时发布失败
  - id: AC-FORM-FS-004
    title: 移动端精简
    ref: { change: bootstrap-ls-mom-mvp, spec: form/form-schema, requirement: 多形态视图, scenario: 移动端精简 }
    codes: [ FORM-04 ]
    slice: PLATFORM
    roles: [ 实施顾问, 班组长 ]
    dataset: acceptance
    steps:
      - 在移动端打开填报表单
    expected:
