    mode: AUTO
    script: ls-mom-modules/ls-mom-form/src/test/java/com/lsmom/form/ViewSchemaTest.java#看板写SQL被拒
  - id: AC-FORM-FS-006
    title: 发布新版本后打开旧单
    ref: { change: bootstrap-ls-mom-mvp, spec: form/form-schema, requirement: 表单版本不可变, scenario: 发布新版本后打开旧单 }
    codes: [ FORM-07 ]
    slice: PLATFORM
    roles: [ 实施顾问, 班组长 ]
    dataset: acceptance
    steps:
      - 表单发布 v4 后打开按 v3 提交的记录
    expected:
      - 按 v3 布局只读显示
    mode: AUTO
    script: ls-mom-modules/ls-mom-form/src/test/java/com/lsmom/form/FormVersionTest.java#发布v2后旧单仍按v1渲染且编辑旧草稿按迁移策略
  - id: AC-FORM-FS-007
    title: 编辑旧单
    ref: { change: bootstrap-ls-mom-mvp, spec: form/form-schema, requirement: 表单版本不可变, scenario: 编辑旧单 }
    codes: [ FORM-07 ]
    slice: PLATFORM
    roles: [ 实施顾问, 班组长 ]
    dataset: acceptance
    steps:
      - 用户编辑一条 v3 草稿
    expected:
      - 系统按已配置的迁移策略提示切换到 v4 或保持 v3
    mode: AUTO
    script: plus-ui/tests/unit/ledger-workspace.spec.ts#编辑旧草稿：迁移策略为保持旧版时按 v1 编辑
  - id: AC-FORM-FS-008
    title: 节点策略引用被删字段
    ref: { change: bootstrap-ls-mom-mvp, spec: form/form-schema, requirement: 升级兼容性校验, scenario: 节点策略引用被删字段 }
    codes: [ FORM-07 ]
    slice: PLATFORM
    roles: [ 实施顾问, 班组长 ]
    dataset: acceptance
    steps:
      - 新表单版本移除了某流程节点 `required` 中的字段
    expected:
      - 发布校验失败并列出该流程节点
    mode: AUTO
    script: ls-mom-modules/ls-mom-form/src/test/java/com/lsmom/form/FormVersionTest.java#新版本移除流程节点必填字段时发布失败并列出节点
  - id: AC-FORM-FS-009
    title: readonly 通配与显式 editable
    ref: { change: bootstrap-ls-mom-mvp, spec: form/form-schema, requirement: 节点字段策略合并, scenario: readonly 通配与显式 editable }
    codes: [ FORM-05 ]
    slice: PLATFORM
    roles: [ 实施顾问, 班组长 ]
    dataset: acceptance
    steps:
      - 节点策略为 `readonly:["*"]`、`editable:["confirmComment"]`
    expected:
      - 仅 `confirmComment` 可编辑，其他字段只读，服务端拒绝修改其他字段
    mode: AUTO
    script: ls-mom-modules/ls-mom-form/src/test/java/com/lsmom/form/NodePolicyCheckTest.java#审核节点只允许修改审核意见
