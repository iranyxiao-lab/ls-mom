    ref: { change: bootstrap-ls-mom-mvp, spec: meta/concept-registry, requirement: Concept 注册, scenario: 核心对象注册 }
    slice: PLATFORM
    roles: [ 实施顾问 ]
    dataset: acceptance
    steps:
      - 系统启动
    expected:
      - 可查询到 `ls.core.Work`、`ls.core.Issue` 等核心 Concept，其存储方式为核心显式表且不可经设计器修改结构
    mode: AUTO
    script: ls-mom-modules/ls-mom-meta/src/test/java/com/lsmom/meta/concept/ConceptRegistryTest.java#启动后可查询核心Concept且为核心显式表
