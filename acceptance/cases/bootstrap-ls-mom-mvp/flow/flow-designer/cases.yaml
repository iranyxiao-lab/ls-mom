    script: plus-ui/tests/e2e/flow-designer.e2e.mjs#服务节点未选 Operation 时校验报错
  - id: AC-FLOW-FD-002
    title: 粘贴 XML
    ref: { change: bootstrap-ls-mom-mvp, spec: flow/flow-designer, requirement: 从配置生成标准流程定义, scenario: 粘贴 XML }
    slice: B
    roles: [ 实施顾问 ]
    dataset: acceptance
    steps:
